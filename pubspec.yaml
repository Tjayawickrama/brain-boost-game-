name: brain_boost
description: "Brain Boost - Train your brain with fun mini-games"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP / API
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.3

  # Fonts
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.69.0

  # Animations
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/logo.png
